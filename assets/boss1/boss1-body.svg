<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <g id="boss1-root">
    <!-- Shadow -->
    <ellipse cx="100" cy="268" rx="50" ry="10" fill="rgba(0,0,0,0.3)"/>

    <!-- Legs -->
    <g id="boss1-left-leg">
      <rect x="65" y="220" width="20" height="40" rx="6" fill="#8B1A1A"/>
      <rect x="60" y="250" width="28" height="14" rx="5" fill="#5C0E0E"/>
    </g>
    <g id="boss1-right-leg">
      <rect x="115" y="220" width="20" height="40" rx="6" fill="#8B1A1A"/>
      <rect x="112" y="250" width="28" height="14" rx="5" fill="#5C0E0E"/>
    </g>

    <!-- Body / Torso -->
    <g id="boss1-body">
      <rect x="60" y="140" width="80" height="90" rx="16" fill="#2A0808"/>
      <rect x="65" y="145" width="70" height="80" rx="12" fill="#4A0F0F"/>
      <!-- Armor plates -->
      <rect x="72" y="155" width="56" height="20" rx="4" fill="#8B1A1A"/>
      <rect x="78" y="180" width="44" height="15" rx="3" fill="#6B1010"/>
      <!-- Core gem -->
      <circle cx="100" cy="175" r="8" fill="#FF3020"/>
      <circle cx="100" cy="175" r="5" fill="#FF6040" opacity="0.8"/>
      <circle cx="100" cy="175" r="2.5" fill="#FFB080"/>
    </g>

    <!-- Arms -->
    <g id="boss1-left-arm">
      <rect x="35" y="150" width="22" height="50" rx="8" fill="#4A0F0F"/>
      <rect x="38" y="155" width="16" height="20" rx="4" fill="#8B1A1A"/>
      <circle cx="46" cy="205" r="10" fill="#5C0E0E"/>
      <circle cx="46" cy="205" r="6" fill="#8B1A1A"/>
    </g>
    <g id="boss1-right-arm">
      <rect x="143" y="150" width="22" height="50" rx="8" fill="#4A0F0F"/>
      <rect x="146" y="155" width="16" height="20" rx="4" fill="#8B1A1A"/>
      <circle cx="154" cy="205" r="10" fill="#5C0E0E"/>
      <circle cx="154" cy="205" r="6" fill="#8B1A1A"/>
    </g>

    <!-- Head -->
    <g id="boss1-head">
      <circle cx="100" cy="110" r="48" fill="#1A0505"/>
      <circle cx="100" cy="110" r="44" fill="#2A0808"/>
      <!-- Helmet rim -->
      <path d="M56 110 Q56 75 100 65 Q144 75 144 110" fill="none" stroke="#8B1A1A" stroke-width="4"/>
      <path d="M60 115 Q60 80 100 70 Q140 80 140 115" fill="none" stroke="#5C0E0E" stroke-width="2"/>
    </g>

    <!-- Eyes -->
    <g id="boss1-eyes">
      <rect x="74" y="103" width="18" height="8" rx="2" fill="#FF2020"/>
      <rect x="76" y="104" width="14" height="6" rx="1.5" fill="#FF6040"/>
      <rect x="78" y="105" width="10" height="4" rx="1" fill="#FFAA80" opacity="0.9"/>

      <rect x="108" y="103" width="18" height="8" rx="2" fill="#FF2020"/>
      <rect x="110" y="104" width="14" height="6" rx="1.5" fill="#FF6040"/>
      <rect x="112" y="105" width="10" height="4" rx="1" fill="#FFAA80" opacity="0.9"/>
    </g>

    <!-- Crest / Antenna -->
    <g id="boss1-crest">
      <polygon points="100,20 88,70 100,60 112,70" fill="#CC1515"/>
      <polygon points="100,25 92,65 100,57 108,65" fill="#FF2020"/>
      <polygon points="100,32 96,58 100,52 104,58" fill="#FF5040" opacity="0.7"/>
    </g>
  </g>
</svg>
